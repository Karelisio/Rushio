name: Build signed release APK

on:
  push:
    # master is the default branch of the repository, main is kept in case it gets renamed
    branches:
      - master
      - main
  workflow_dispatch: {}

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Gradle daemon is pinned to JDK 25 (gradle/gradle-daemon-jvm.properties).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Decode and check keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # The alias is not sensitive: it is also accepted as a repository variable
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing. À créer dans Settings > Secrets and variables > Actions, onglet Secrets, bouton New repository secret, avec exactement ces noms."
            exit 1
          fi

          export KEYSTORE_FILE="$RUNNER_TEMP/rushio-release.jks"
          # Line breaks and spaces pasted with the base64 text are ignored
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"; then
            echo "::error::KEYSTORE_BASE64 n'est pas du base64 valide (voir le README pour l'obtenir)."
            exit 1
          fi

          # Reports a wrong password or alias now rather than at the end of the build
          java -Dstdout.encoding=UTF-8 .github/scripts/CheckKeystore.java
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Verify signature and rename APK
        run: |
          APK=$(find androidApp/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          VERSION=$(grep -E 'val appVersionName' androidApp/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          mkdir -p dist
          cp "$APK" "dist/Rushio-${VERSION}-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rushio-release-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rushio-release.jks"
